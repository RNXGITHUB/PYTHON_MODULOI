    /* SQL Terminal */
    .terminal {

      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 0.8rem;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; font-size: 0.85rem; }
    th { background: #f8fafc; }

    .btn-del {

      color: white;

</head>
