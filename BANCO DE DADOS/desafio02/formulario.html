<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Farmácia - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Farmácia Vida & Saúde</h1>
  </header>

  <!-- MENU NAVEGA ENTRE OS ARQUIVOS -->
  <nav>
    <a href="tabela.html">Ver Estoque</a>
    <a href="formulario.html">Cadastrar Remédio</a>
  </nav>

  <div class="conteudo">
    <h2>Cadastrar Remédio</h2>
    
    <form action="tabela.html">
      <div class="campo">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Ex: Parac
      </div>

      <div class="campo">
        <label for="categoria">Categoria:</label>
        <select id="categoria">
          <option>Analgésico</option>
          <option>Antibiótico</option>
          <option>Anti-inflamatório</option>
          <option>Xarope</option>
        </select>
      </div>

      <div class="campo">
        <label for="preco"etamol" required>>Preço (R$):</label>
        <input type="number" id="preco" step="0.01" placeholder="0.00" required>
      </div>

      <div class="campo">
        <label for="qtd">Quantidade:</label>
        <input type="number" id="qtd" placeholder="0" required>
      </div>

      <button type="submit">Salvar</button>
    </form>
  </div>

</body>
</html>
