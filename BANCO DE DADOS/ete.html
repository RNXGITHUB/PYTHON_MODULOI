<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETE José Joaquim da Silva Filho - Sistema Escolar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      color: #333;
      padding: 20px;
    }

    /* Cabeçalho da Escola */
    header {
      background-color: #004a8f;
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    /* Container Principal */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 850px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    /* Cards e Formulários */
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-top: 4px solid #004a8f;
    }

    .card.professor {
      border-top-color: #28a745;
    }

    h2 {
      font-size: 1.2rem;
      color: #004a8f;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card.professor h2 {
      color: #28a745;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      color: white;
      background-color: #004a8f;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #003366;
    }

    .card.professor button {
      background-color: #28a745;
    }

    .card.professor button:hover {
      background-color: #1e7e34;
    }

    .btn-danger {
      background-color: #dc3545;
      padding: 4px 8px;
      width: auto;
      font-size: 0.75rem;
    }

    .btn-danger:hover {
      background-color: #bd2130;
    }

    /* Tabelas */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 0.85rem;
    }

    th, td {
      border: 1px solid #e0e0e0;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f8f9fa;
      font-weight: 600;
    }

    /* Terminal SQL Educativo */
    .sql-terminal {
      background-color: #1e1e1e;
      color: #4af626;
      font-family: 'Courier New', Courier, monospace;
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 0.8rem;
      word-break: break-all;
    }

    .sql-title {
      color: #aaa;
      font-size: 0.75rem;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho Institucional -->
  <header>
    <h1>🏫 ETE José Joaquim da Silva Filho</h1>
    <p>Painel Didático: Simulação de Banco de Dados com LocalStorage e SQLite</p>
  </header>

  <div class="grid-container">

    <!-- SEÇÃO DE ALUNOS -->
    <div class="card">
      <h2>👨‍🎓 Módulo: Alunos</h2>
      <form id="formAluno">
        <label for="nomeAluno">Nome Completo:</label>
        <input type="text" id="nomeAluno" placeholder="Ex: Maria Clara" required>

        <label for="endereçoAluno">Endereço Completo:</label>
        <input type="text" id="endereçoAluno" placeholder="Ex: Rua alto" required>

        <label for="cursoAluno">Curso Técnico:</label>
        <select id="cursoAluno" required>
          <option value="">Selecione...</option>
          <option value="Desenvolvimento de Sistemas">Desenvolvimento de Sistemas</option>
          <option value="Redes de Computadores">Redes de Computadores</option>
          <option value="Administração">Administração</option>
        </select>

        <button type="submit">Cadastrar Aluno</button>
      </form>

      <!-- Terminal Educativo SQL -->
      <div class="sql-terminal">
        <div class="sql-title">Comando SQLite equivalente (INSERT):</div>
        <div id="sqlAluno">INSERT INTO alunos (nome, curso, endereço) VALUES ('...', '...');</div>
      </div>

      <!-- Tabela Alunos -->
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Endereço</th>
            <th>Curso</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="tabelaAlunos">
          <!-- Linhas inseridas via JS -->
        </tbody>
      </table>
    </div>

    
  </div>

  <script>
    // --- LÓGICA DO LOCALSTORAGE (SIMULANDO TABELAS DO BANCO DE DADOS) ---

    // Função para buscar dados armazenados ou criar lista vazia caso não exista
    function obterTabela(nomeTabela) {
      const dados = localStorage.getItem(nomeTabela);
      return dados ? JSON.parse(dados) : [];
    }

    // Função para salvar a lista no LocalStorage (simulando a gravação no disco)
    function salvarTabela(nomeTabela, dados) {
      localStorage.setItem(nomeTabela, JSON.stringify(dados));
    }

    // --- CADASTRO DE ALUNOS ---
    document.getElementById('formAluno').addEventListener('submit', function(e) {
      e.preventDefault();

      const nome = document.getElementById('nomeAluno').value;
      const endereço = document.getElementById('endereçoAluno').value;
      const curso = document.getElementById('cursoAluno').value;
      const alunos = obterTabela('tb_alunos');

      // Gera um ID incremental simples (simulando AUTOINCREMENT)
      const novoId = alunos.length > 0 ? alunos[alunos.length - 1].id + 1 : 1;

      // Cria o objeto registro (Linha da Tabela)
      const novoAluno = { id: novoId, nome: nome, endereço: endereço, curso: curso };
      alunos.push(novoAluno);

      // Salva no LocalStorage
      salvarTabela('tb_alunos', alunos);

      // Exibe a consulta SQL correspondente
      document.getElementById('sqlAluno').textContent = 
        `INSERT INTO alunos (id, nome, endereço,curso) VALUES (${novoId}, '${nome}','${endereço}', '${curso}');`;

      // Limpa os campos e atualiza a interface
      document.getElementById('nomeAluno').value = '';
      document.getElementById('endereçoAluno').value = '';
      document.getElementById('cursoAluno').value = '';
      carregarAlunos();
    });

    

    // --- RENDERIZAÇÃO DAS TABELAS NA TELA ---
    function carregarAlunos() {
      const alunos = obterTabela('tb_alunos');
      const tbody = document.getElementById('tabelaAlunos');
      tbody.innerHTML = '';

      alunos.forEach(aluno => {
        tbody.innerHTML += `
          <tr>
            <td>${aluno.id}</td>
            <td>${aluno.nome}</td>
            <td>${aluno.endereço}</td>
            <td>${aluno.curso}</td>
            <td>
              <button class="btn-danger" onclick="deletarRegistro('tb_alunos', ${aluno.id})">DELETE</button>
            </td>
          </tr>
        `;
      });
    }

      // --- EXCLUSÃO DE REGISTROS (DELETE) ---
    function deletarRegistro(nomeTabela, id) {
      let tabela = obterTabela(nomeTabela);
      // Filtra mantendo apenas os itens com ID diferente do selecionado
      tabela = tabela.filter(item => item.id !== id);
      salvarTabela(nomeTabela, tabela);

      // Atualiza as exibições
      if (nomeTabela === 'tb_alunos') {
        document.getElementById('sqlAluno').textContent = `UPDATE FROM alunos WHERE id = ${id};`;
        carregarAlunos();
      } else {
        document.getElementById('sqlProf').textContent = `UPDATE FROM professores WHERE id = ${id};`;
        carregarProfessores();
      }
    }
    // Carrega os dados ao abrir a página
    carregarAlunos();

    // --- EXCLUSÃO DE REGISTROS (DELETE) ---
    function deletarRegistro(nomeTabela, id) {
      let tabela = obterTabela(nomeTabela);
      // Filtra mantendo apenas os itens com ID diferente do selecionado
      tabela = tabela.filter(item => item.id !== id);
      salvarTabela(nomeTabela, tabela);

      // Atualiza as exibições
      if (nomeTabela === 'tb_alunos') {
        document.getElementById('sqlAluno').textContent = `DELETE FROM alunos WHERE id = ${id};`;
        carregarAlunos();
      } else {
        document.getElementById('sqlProf').textContent = `DELETE FROM professores WHERE id = ${id};`;
        carregarProfessores();
      }
    }
    // Carrega os dados ao abrir a página
    carregarAlunos();
    
  </script>
</body>
</html>
