<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Itens - RPG Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .painel-loja {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            text-align: center;
            width: 400px;
            border: 2px solid #eab308;
        }
        h2 { color: #fde047; margin-top: 0; }
        .saldo-box {
            background-color: #020617;
            border: 2px solid #ca8a04;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
        .texto-moedas {
            font-size: 32px;
            font-weight: bold;
            color: #eab308;
            margin: 5px 0;
        }
        .botoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .btn-missao { background-color: #16a34a; }
        .btn-missao:hover { background-color: #15803d; }
        .btn-pocao { background-color: #2563eb; }
        .btn-pocao:hover { background-color: #1d4ed8; }
        .btn-reset { background-color: #475569; }
        
        #mensagem {
            margin-top: 15px;
            font-weight: bold;
            color: #f1f5f9;
        }
        #inventario {
            margin-top: 10px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="painel-loja">
        <h2>🛒 Loja do Aventureiro</h2>
        
        <div class="saldo-box">
            <p>Seu Ouro Atual:</p>
            <p class="texto-moedas" id="moedasDisplay">100 Ouro</p>
        </div>

        <div class="botoes">
            <button class="btn-missao" onclick="cumprirMissao()">📜 Cumprir Missão (+30 Ouro)</button>
            <button class="btn-pocao" onclick="comprarPocao()">🧪 Comprar Poção (-25 Ouro)</button>
            <button class="btn-reset" onclick="reiniciarLoja()">🔄 Reiniciar Saldo</button>
        </div>

        <p id="mensagem">Bem-vindo à loja! Faça suas compras.</p>
        <p id="inventario">Itens no Inventário: Nenhum</p>
    </div>

    <script>
        // 1. Variáveis de Estado Global
        let moedas = 100;
        let quantidadePocoes = 0;

        // 2. Função para Ganhar Ouro
        function cumprirMissao() {
            moedas = moedas + 30;
            atualizarTela();
            document.getElementById("mensagem").innerText = "Você completou uma missão e ganhou 30 de Ouro!";
        }

        // 3. Função para Comprar Item (Com Validação)
        function comprarPocao() {
            if (moedas >= 25) {
                moedas = moedas - 25;
                quantidadePocoes = quantidadePocoes + 1;
                atualizarTela();
                document.getElementById("mensagem").innerText = "Poção comprada com sucesso!";
            } else {
                document.getElementById("mensagem").innerText = "❌ Ouro insuficiente para comprar a Poção!";
            }
        }

        // 4. Atualização Central do DOM
        function atualizarTela() {
            document.getElementById("moedasDisplay").innerText = moedas + " Ouro";
            document.getElementById("inventario").innerText = `Itens no Inventário: ${quantidadePocoes} Poção(ões)`;
        }

        // 5. Reiniciar
        function reiniciarLoja() {
            moedas = 100;
            quantidadePocoes = 0;
            atualizarTela();
            document.getElementById("mensagem").innerText = "Sua carteira e inventário foram resetados!";
        }
    </script>

</body>
</html>
